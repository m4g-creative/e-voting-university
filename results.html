<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Official Results - E-Election University</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/voter.css">
</head>
<body>

  <header class="official-header">
    <div class="header-content">
      <div class="brand-container">
        <div class="logo-svg">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 22C12 22 20 18 20 12V5L12 2L4 5V12C4 18 12 22 12 22Z" fill="#2563EB"/>
            <path d="M8 11L11 14L16 8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1>E-Election University</h1>
      </div>
      <span>Official Results</span>
    </div>
  </header>

  <main class="container">
    <div class="panel wide-panel">
      <div class="panel-header">
        <h2>Election Results</h2>
        <p>Final certified results</p>
      </div>

      <div id="statusBox" class="status-box warn" style="display: none;"></div>

      <div id="resultsContainer" class="results-container">
        <p style="text-align: center; color: var(--text-muted);">Loading results from secure server...</p>
      </div>
      
      <div class="panel-footer" style="text-align: center; margin-top: 20px;">
        <a href="index.html" class="btn secondary">Return to Home</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script>
    async function loadPublicResults() {
      const resultsContainer = document.getElementById('resultsContainer');
      const statusBox = document.getElementById('statusBox');

      const { data: settings, error: setError } = await _supabase.from('settings').select('status').eq('id', 1).single();
      
      if (setError || settings.status !== 'locked') {
        resultsContainer.innerHTML = '';
        statusBox.textContent = 'Official results have not been published yet. The election is still ongoing or in setup.';
        statusBox.style.display = 'block';
        return;
      }

      const { data: votes } = await _supabase.from('votes').select('*');
      const { data: candidates } = await _supabase.from('users').select('*').eq('role', 'candidate').eq('status', 'approved');

      const totalVotes = votes ? votes.length : 0;

      if (!candidates || candidates.length === 0 || totalVotes === 0) {
        resultsContainer.innerHTML = '<p style="text-align:center; color: var(--text-muted);">No votes were recorded in this election.</p>';
        return;
      }

      const counts = {};
      candidates.forEach(c => counts[c.id] = 0);
      votes.forEach(v => {
        if (counts[v.candidate_id] !== undefined) counts[v.candidate_id]++;
      });

      let maxVotes = 0;
      let winnerName = '';
      let isTie = false;

      candidates.forEach(c => {
        if (counts[c.id] > maxVotes) {
          maxVotes = counts[c.id];
          winnerName = c.name;
          isTie = false;
        } else if (counts[c.id] === maxVotes && maxVotes > 0) {
          isTie = true;
        }
      });

      let html = candidates.map(c => {
        const count = counts[c.id];
        const percentage = totalVotes > 0 ? ((count / totalVotes) * 100).toFixed(1) : 0;
        return `
          <div class="result-row">
            <div class="result-header">
              <span>${esc(c.name)}</span>
              <span>${count} votes (${percentage}%)</span>
            </div>
            <div class="result-bar-bg">
              <div class="result-bar-fill" style="width: ${percentage}%;"></div>
            </div>
          </div>
        `;
      }).join('');

      if (isTie) {
        html += `<div class="winner-text" style="background-color: var(--warning-bg); border-color: #FCD34D; color: var(--warning);">Result: Tie between candidates. No single winner.</div>`;
      } else if (winnerName) {
        html += `<div class="winner-text">Winner: ${esc(winnerName)} (${maxVotes} votes)</div>`;
      }

      resultsContainer.innerHTML = html;
    }

    loadPublicResults();
  </script>
</body>
</html>
