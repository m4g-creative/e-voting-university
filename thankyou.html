<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vote Confirmed - E-Election University</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/voter.css">
  <style>
    .success-mark {
      font-size: 48px;
      color: var(--success);
      margin-bottom: 20px;
      font-weight: bold;
    }
    .auto-redirect {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <header class="official-header">
    <div class="header-content">
      <h1>E-Election University</h1>
      <span>Voting Complete</span>
    </div>
  </header>

  <main class="container">
    <div class="panel" style="text-align: center;">
      <div class="success-mark">[ ✓ ]</div>
      <h2>Vote Successfully Cast</h2>
      <p class="instruction">Your vote has been recorded securely in the system.</p>
      
      <div style="background: var(--bg-color); padding: 15px; border: 1px solid var(--border); margin: 20px 0;">
        <p style="margin:0; font-size: 14px; color: var(--text-main);">Thank you for participating in the democratic process.</p>
      </div>

      <p class="auto-redirect">Redirecting to home screen for the next voter in <span id="timer">5</span> seconds...</p>
      
      <a href="index.html" class="btn secondary btn-block" style="margin-top: 15px;">Return to Home Now</a>
    </div>
  </main>

  <script>
    let timeLeft = 5;
    const timerEl = document.getElementById('timer');
    
    const interval = setInterval(() => {
      timeLeft--;
      timerEl.textContent = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(interval);
        window.location.href = 'index.html';
      }
    }, 1000);
  </script>
</body>
</html>
