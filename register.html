<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - E-Election University</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/voter.css">
</head>
<body>

  <header class="official-header">
    <div class="header-content">
      <h1>E-Election University</h1>
      <span>Registration Portal</span>
    </div>
  </header>

  <main class="container">
    <div class="panel">
      <div class="panel-header">
        <h2>Create an Account</h2>
        <p>Register as a Voter or Candidate</p>
      </div>

      <div id="statusBox" class="status-box"></div>

      <div class="form-group">
        <label for="regName">Full Name</label>
        <input type="text" id="regName" placeholder="e.g. Ali Khan">
      </div>

      <div class="form-group">
        <label for="regRoll">Roll Number / ID</label>
        <input type="text" id="regRoll" placeholder="e.g. CS-2026-01">
      </div>

      <div class="form-group">
        <label for="regPass">Password</label>
        <input type="password" id="regPass" placeholder="Create a password">
      </div>

      <!-- NAYA CUSTOM ROLE SELECTOR -->
      <div class="form-group">
        <label>Register As</label>
        <div class="custom-radio-group">
          <label class="custom-radio-label selected" id="lbl-voter">
            <input type="radio" name="regRole" value="voter" checked>
            Voter
          </label>
          <label class="custom-radio-label" id="lbl-candidate">
            <input type="radio" name="regRole" value="candidate">
            Candidate
          </label>
        </div>
      </div>

      <button id="registerBtn" class="btn primary btn-block">Submit Request</button>
      
      <div class="panel-footer">
        <a href="login.html" class="small-link">Already have an account? Login here</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  
  <script>
    const registerBtn = document.getElementById('registerBtn');
    const statusBox = document.getElementById('statusBox');
    
    // Custom Radio Logic (Styling on click)
    const radioLabels = document.querySelectorAll('.custom-radio-label');
    radioLabels.forEach(label => {
      label.addEventListener('click', () => {
        radioLabels.forEach(l => l.classList.remove('selected'));
        label.classList.add('selected');
      });
    });

    registerBtn.addEventListener('click', async () => {
      const name = document.getElementById('regName').value.trim();
      const roll_no = document.getElementById('regRoll').value.trim();
      const password = document.getElementById('regPass').value.trim();
      
      // Naya tareeqa role nikalne ka (radio button se)
      const role = document.querySelector('input[name="regRole"]:checked').value;

      if (!name || !roll_no || !password) {
        statusBox.textContent = 'Please fill all fields.';
        statusBox.className = 'status-box error';
        return;
      }

      registerBtn.disabled = true;
      registerBtn.textContent = 'Submitting...';

      const { error } = await _supabase
        .from('users')
        .insert([{ name, roll_no, password, role, status: 'pending' }]);

      if (error) {
        statusBox.textContent = error.message.includes('unique') 
          ? 'This Roll Number is already registered.' 
          : 'Error: ' + error.message;
        statusBox.className = 'status-box error';
        registerBtn.disabled = false;
        registerBtn.textContent = 'Submit Request';
      } else {
        statusBox.textContent = 'Registration request submitted! Please wait for Admin approval.';
        statusBox.className = 'status-box success';
        registerBtn.textContent = 'Request Sent';
        setTimeout(() => window.location.href = 'login.html', 3000);
      }
    });
  </script>
</body>
          </html>
