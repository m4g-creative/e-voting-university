<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome - E-Election University</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/voter.css">
</head>
<body>

  <header class="official-header">
    <div class="header-content">
      <h1>E-Election University</h1>
      <span>Official Voting Portal</span>
    </div>
  </header>

  <main class="container">
    <div class="panel" style="text-align: center;">
      <div class="panel-header">
        <h2>Welcome to the E-Voting Portal</h2>
        <p>Please login or register to participate in the democratic process.</p>
      </div>

      <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 30px;">
        <a href="login.html" class="btn primary btn-block">Login to Vote</a>
        
        <a href="register.html" class="btn secondary btn-block">Register as Voter / Candidate</a>
        
        <div style="margin: 10px 0; border-top: 1px solid var(--border);"></div>
        
        <a href="results.html" class="btn secondary btn-block">View Public Results</a>
      </div>
      
      <div class="panel-footer" style="margin-top: 25px; font-size: 13px; color: var(--text-muted);">
        <p>Secure E-Voting System</p>
      </div>
    </div>
  </main>

</body>
</html>
